name: Last Frontier V7 — staging acceptance
on:
  push:
    branches:
      - feature/v7-staging-20261017
    paths:
      - 'app/**'
      - '.github/workflows/v7-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontier-v7-staging
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 2D survival logic and new enemy sprites
        working-directory: app
        run: |
          node --check src/game.js
          node --check src/animation.js
          node --test tests/*.test.cjs
      - name: Install open-source renderer and package game
        working-directory: app
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/src/game.js
          test -f dist/THIRD_PARTY_LICENSES/PACKAGES.json
      - name: Install headless Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify actual game on desktop and mobile with/without WebGL
        run: python app/tests/test_v7_browser.py
      - name: Assemble verified static-site artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          root=Path('app/dist')
          assert (root/'index.html').exists()
          assert len(list((root/'assets/characters').glob('*.webp')))>=5
          report=json.loads((Path('app/browser-v7-evidence')/'results.json').read_text())
          assert len(report)==3 and all(r.get('passed') for r in report)
          result=Path('last-frontier-v7-verified-static.zip')
          with zipfile.ZipFile(result,'w',zipfile.ZIP_DEFLATED) as z:
              for f in root.rglob('*'):
                  if f.is_file():z.write(f,f.relative_to(root))
          print(result, result.stat().st_size, 'bytes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-frontier-v7-staging-build
          path: |
            last-frontier-v7-verified-static.zip
            app/browser-v7-evidence/
          retention-days: 14
          if-no-files-found: warn
