name: Publish verified isometric Outbreak
on:
  push:
    branches: [main]
    paths: ['.github/workflows/outbreak-publish-verified.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: last-frontier-pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe28e1cfcca3b72fb95cca624254eb908302358e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify game and build bundled open source renderer and audio
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          npm run build:vite
          npm run verify:dist
      - name: Install Chromium browser checks
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verify game before publishing
        env:
          FRONTIER_REQUIRE_PIXI: '1'
        run: python3 app/tests/test_outbreak_browser.py
      - name: Preserve all deployed versions byte-for-byte and add /outbreak/
        run: python3 app/scripts/preserve_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outbreak-publish-verification
          path: |
            app/docs/OUTBREAK_BROWSER_RESULTS.json
            app/docs/screenshots/outbreak-*.png
            app/docs/screenshots/siege-*.png
            outbreak-pages-preservation.json
            app/last-frontier-release.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-outbreak
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}outbreak/
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
