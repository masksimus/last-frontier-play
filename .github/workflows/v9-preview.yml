name: Publish isolated V9 preview (preserve V8)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v9-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: last-frontier-pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37a36847cd85102981fdf521d6fb62d45b45173b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build previously accepted V9 commit
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Preserve every deployed V8 file byte-for-byte; add V9 under v9/
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, shutil, time, urllib.request
          from pathlib import Path
          from urllib.parse import quote
          base='https://masksimus.github.io/last-frontier-play/'
          expected='da2777fe9607667fe58e7dce50912bac3be2535ef08f232ffcb661eb092048d9'
          def get(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url,timeout=30) as response:return response.read()
                  except Exception:
                      if attempt==2:raise
                      time.sleep(1)
          raw=get(base+'build-manifest.json')
          assert hashlib.sha256(raw).hexdigest()==expected,'V8 changed: refuse to overwrite a newer deployment'
          manifest=json.loads(raw)
          root=Path('pages-preview');root.mkdir()
          def preserve(item):
              relative=Path(item['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0]!='v9'
              data=get(base+quote(item['path']))
              assert len(data)==item['bytes'] and hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
              target=root/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:list(pool.map(preserve,manifest['files']))
          (root/'build-manifest.json').write_bytes(raw)
          (root/'.nojekyll').touch()
          shutil.copytree('app/dist',root/'v9')
          shutil.copy2('app/last-frontier-v9.1-rc1-yandex.zip',root/'v9/last-frontier-v9.1-rc1-yandex.zip')
          for item in manifest['files']:
              assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256']
          assert (root/'v9/index.html').is_file()
          print('Preserved',len(manifest['files']),'V8 files; V9 added at /v9/')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}v9/
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
