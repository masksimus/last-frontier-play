name: Last Frontier V8 - Weapon and Boss Acceptance
on:
  push:
    branches: [feature/v8-weapons-boss-20261017]
    paths:
      - 'app/**'
      - '.github/workflows/v8-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: last-frontier-v8-staging
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all combat, graphics and survival tests
        working-directory: app
        run: |
          node --check src/core.js
          node --check src/animation.js
          node --check src/combat-v8.js
          node --check src/game.js
          node --test tests/*.test.cjs
      - name: Build Vite and package production web game
        working-directory: app
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/src/combat-v8.js
          test -f dist/THIRD_PARTY_LICENSES/PACKAGES.json
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify actual V8 game on desktop and mobile, plus GPU fallback
        run: python app/tests/test_v8_browser.py
      - name: Verify safe production archive
        run: |
          python - <<'PY'
          import zipfile,json,hashlib
          from pathlib import Path
          package=Path('app/last-frontier-v6-yandex.zip')
          with zipfile.ZipFile(package) as z:
              names=set(z.namelist())
              assert 'src/combat-v8.js' in names
              assert 'build-manifest.json' in names
              manifest=json.loads(z.read('build-manifest.json'))
              for f in manifest['files']:
                  assert hashlib.sha256(z.read(f['path'])).hexdigest()==f['sha256']
              assert not any(n.startswith('../') or '/.github/' in n or n.startswith('studio/') for n in names)
              print('Verified',len(names),'game-only files')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-frontier-v8-verified
          path: |
            app/last-frontier-v6-yandex.zip
            app/browser-v8-evidence/
          retention-days: 14
          if-no-files-found: warn
