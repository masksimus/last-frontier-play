name: Game Tests and Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/game-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/game-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build HTML5 game
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests and build
        run: npm run verify
      - name: Verify bundled entry point
        run: test -s dist/index.html
      - name: Upload testable HTML5 game
        uses: actions/upload-artifact@v4
        with:
          name: last-frontier-html5-build
          path: app/dist/
          if-no-files-found: error
          retention-days: 7
