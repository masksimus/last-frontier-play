name: Current game release candidate
on:
  push:
    paths: ['app/**', '.github/workflows/release-check.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/release-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and build without installing dependencies
        working-directory: app
        run: npm run verify
      - name: Install browser smoke dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verify campaign in Chromium on desktop and touch
        run: python3 app/tests/test_campaign_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-frontier-release-candidate
          path: |
            app/last-frontier-release.zip
            app/dist/build-manifest.json
            app/docs/CAMPAIGN_BROWSER_RESULTS.json
            app/docs/screenshots/
          if-no-files-found: error
          retention-days: 14
  enhanced:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer and audio libraries
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify enhanced game archive
        working-directory: app
        run: |
          npm run build:vite
          npm run verify:dist
      - name: Install browser smoke dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verify PixiJS campaign in Chromium on desktop and touch
        env:
          FRONTIER_REQUIRE_PIXI: '1'
        run: python3 app/tests/test_campaign_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-frontier-pixi-release-candidate
          path: |
            app/last-frontier-release.zip
            app/dist/build-manifest.json
            app/docs/CAMPAIGN_BROWSER_RESULTS.json
            app/docs/screenshots/
            app/package-lock.json
          if-no-files-found: error
          retention-days: 14
