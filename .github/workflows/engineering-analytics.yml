name: Engineering Analytics

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/engineering-analytics.mjs'
      - 'docs/ANALYTICS.md'
      - '.github/workflows/engineering-analytics.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1,3,5'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: engineering-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test aggregation logic
        run: node scripts/engineering-analytics.mjs --self-test
      - name: Fetch source data and build report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/engineering-analytics.mjs
      - name: Archive analytics
        uses: actions/upload-artifact@v4
        with:
          name: engineering-analytics
          path: reports/engineering-analytics/
          if-no-files-found: error
          retention-days: 7
