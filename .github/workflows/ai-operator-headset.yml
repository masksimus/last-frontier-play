name: Operator headset viewer verification
on:
  push:
    branches: [ai/fix-operator-headset-20261020]
    paths:
      - .github/workflows/ai-operator-headset.yml
      - app/public/operator-preview.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check preview JavaScript syntax and headset correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/public/operator-preview.html').read_text()
          assert 'function correctHeadset(root)' in html
          assert 'original.applyBoneTransform(i,p)' in html
          assert 'head.attach(fixed)' in html
          assert 'new THREE.Vector3(0,-0.12,0)' in html
          assert 'GLTFExporter' in html
          code=html.split('<script type="module">',1)[1].split('</script>',1)[0]
          Path('/tmp/operator-preview.mjs').write_text(code)
          PY
          node --check /tmp/operator-preview.mjs
      - name: Test and build game and GLB viewer
        run: |
          npm install --prefix app --no-audit --no-fund
          npm --prefix app run test
          npm --prefix app run build
          test -s app/dist/operator-preview.html
          test -s app/dist/models/characters/tactical_operator.glb
          grep -q 'Headphones_corrected' app/dist/operator-preview.html
