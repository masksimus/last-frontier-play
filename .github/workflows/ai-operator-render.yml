name: AI operator - render model previews
on:
  push:
    branches:
      - ai/tactical-operator-real-mesh
    paths:
      - .github/workflows/ai-operator-render.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/tactical-operator-real-mesh
      - name: Install headless Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy python3-pip
          blender --version
          blender --background --python-expr "import sys;print('Blender Python:',sys.version,sys.path)"
      - name: Render front, three-quarter and rear views
        run: |
          test -s app/public/models/characters/tactical_operator.glb
          blender --background -t 2 --python tools/render_ai_operator.py
          test -s app/public/models/characters/tactical_operator_front.png
          test -s app/public/models/characters/tactical_operator_threequarter.png
          test -s app/public/models/characters/tactical_operator_back.png
      - name: Commit preview images and audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/models/characters/tactical_operator_front.png \
                  app/public/models/characters/tactical_operator_threequarter.png \
                  app/public/models/characters/tactical_operator_back.png \
                  app/public/models/characters/operator_visual_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "review: add real renders of licensed operator model"
            git push origin HEAD:ai/tactical-operator-real-mesh
          fi
